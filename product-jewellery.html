<!-- ENGINE CODE ACTION INTERACTIONS -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const mobileToggle = document.getElementById('mobile-toggle');
        const navMenu = document.getElementById('nav-menu');
        const dropdownParent = document.getElementById('dropdown-parent');
        const dropdownBtn = document.getElementById('dropdown-btn');

        // Synchronize UI header count badge with localStorage
        updateGlobalCartCountDisplay();

        // Hamburger toggle logic
        if (mobileToggle) {
            mobileToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                navMenu.classList.toggle('active');
                
                const icon = mobileToggle.querySelector('i');
                if (navMenu.classList.contains('active')) {
                    if (icon) icon.className = 'fa-solid fa-xmark';
                } else {
                    if (icon) icon.className = 'fa-solid fa-bars';
                    if (dropdownParent) dropdownParent.classList.remove('open-active');
                }
            });
        }

        // Mobile specific subdropdown alignment interceptor
        if (dropdownBtn && dropdownParent) {
            dropdownBtn.addEventListener('click', (e) => {
                if (window.innerWidth <= 991) {
                    e.preventDefault();
                    e.stopPropagation();
                    dropdownParent.classList.toggle('open-active');
                }
            });
        }

        // Close responsive frame drawer windows safely on click-out context
        document.addEventListener('click', (e) => {
            if (navMenu && mobileToggle && !navMenu.contains(e.target) && !mobileToggle.contains(e.target)) {
                navMenu.classList.remove('active');
                const icon = mobileToggle.querySelector('i');
                if (icon) icon.className = 'fa-solid fa-bars';
                if (dropdownParent) dropdownParent.classList.remove('open-active');
            }
        });

        // Initialize product card prices dynamically
        updateProductPrice('p1');
        updateProductPrice('p2');
        updateProductPrice('p3');
        updateProductPrice('p4');
    });

    // Synchronize UI header count badge with localStorage key 'cart'
    function updateGlobalCartCountDisplay() {
        try {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const totalCount = cart.reduce((sum, item) => sum + parseInt(item.quantity || 1), 0);
            const countBadge = document.getElementById('global-cart-count');
            if (countBadge) {
                countBadge.textContent = totalCount;
            }
        } catch (error) {
            console.error("Error reading cart from storage:", error);
        }
    }

    // Dynamic price tags update on option or quantity selector change
    function updateProductPrice(productId) {
        const selectElement = document.getElementById(`${productId}-color`) || document.getElementById(`${productId}-variant`);
        const qtyElement = document.getElementById(`${productId}-qty`);
        const priceTag = document.getElementById(`${productId}-price-tag`);

        if (selectElement && qtyElement && priceTag) {
            const selectedOption = selectElement.options[selectElement.selectedIndex];
            const unitPrice = parseFloat(selectedOption.getAttribute('data-price')) || 0;
            const quantity = parseInt(qtyElement.value, 10) || 1;
            const totalPrice = unitPrice * quantity;

            priceTag.textContent = `₹${totalPrice}`;
        }
    }

    // Standardized Add To Cart interaction matching your working cart system
    function addJewelleryToCart(id, name, img) {
        try {
            const selectElement = document.getElementById(`${id}-color`) || document.getElementById(`${id}-variant`);
            const qtyElement = document.getElementById(`${id}-qty`);

            if (!selectElement || !qtyElement) return;

            const selectedOption = selectElement.options[selectElement.selectedIndex];
            const variant = selectElement.value;
            const unitPrice = parseFloat(selectedOption.getAttribute('data-price')) || 0;
            const quantityToAdd = parseInt(qtyElement.value, 10) || 1;

            let cart = JSON.parse(localStorage.getItem('cart')) || [];

            // Unique key per item variant combination
            const itemUniqueId = `${id}-${variant.replace(/\s+/g, '-').toLowerCase()}`;

            const existingItemIndex = cart.findIndex(item => item.id === itemUniqueId);

            if (existingItemIndex > -1) {
                cart[existingItemIndex].quantity += quantityToAdd;
            } else {
                cart.push({
                    id: itemUniqueId,
                    name: name,
                    price: unitPrice,
                    image: img,
                    variant: variant,
                    quantity: quantityToAdd
                });
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            updateGlobalCartCountDisplay();

            alert(`${quantityToAdd} x ${name} (${variant}) has been added to your cart!`);
        } catch (error) {
            console.error("Could not complete add operation:", error);
            alert("An error occurred while adding the item to the cart.");
        }
    }
</script>
